
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find and explore internship opportunities.">
    <title>Responsive Internship Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Internship Board</h1>
            <p>Find your next learning opportunity.</p>

            <form id="filter-form" role="search">
                <div class="form-group">
                    <label for="search">Search internships</label>
                    <input
                        type="search"
                        id="search"
                        placeholder="Search by title or skill..."
                    >
                </div>

                <div class="form-group">
                    <label for="domain">Choose domain</label>
                    <select id="domain">
                        <option value="">All Domains</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mode">Choose work mode</label>
                    <select id="mode">
                        <option value="">All Work Modes</option>
                        <option value="Remote">Remote</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="On-site">On-site</option>
                    </select>
                </div>

                <button type="button" id="clear-filters">
                    Clear Filters
                </button>
            </form>
        </div>
    </header>

    <main class="container">
        <h2>Available Internships</h2>

        <p id="status" role="status" aria-live="polite">
            Loading internships...
        </p>

        <button type="button" id="retry-button" hidden>
            Retry Loading
        </button>

        <section
            id="internship-list"
            class="internship-grid"
            aria-label="Internship listings">
        </section>
    </main>

    <footer class="footer">
        <p>Responsive Internship Board | Built with HTML, CSS and JavaScript</p>
    </footer>
</body>
</html>
